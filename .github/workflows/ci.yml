name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'gofmt reports unformatted files:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./... -race -count=1
      - name: perf harness module
        run: |
          cd e2e/perf
          go build ./...
          go vet ./...
          # hashgen carries //go:build ignore and imports mydns/internal/auth,
          # so it compiles from the repository module, not the nested one.
          cd ../..
          go run ./e2e/perf/hashgen/main.go test
