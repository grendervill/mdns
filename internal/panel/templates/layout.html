{{define "rail"}}
<aside class="rail">
  <div class="brand">mdns<small>{{.Domain}}</small></div>
  <nav class="nav">
    <a{{if eq .Nav "status"}} class="on" aria-current="page"{{end}} href="/panel/">Статус</a>
    <a{{if eq .Nav "history"}} class="on" aria-current="page"{{end}} href="/panel/history">Запросы</a>
  </nav>
  <form method="post" action="/logout" class="rail-foot">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <button class="btn small" type="submit">Выйти</button>
  </form>
</aside>
{{end}}
{{define "feed_row"}}<div class="q"><span class="t">{{.Time}}</span><span class="name" title="{{.Title}}">{{.QName}}</span><span class="proto">{{.Proto}}</span><span class="tag {{.Tag}}">{{.TagText}}</span><span class="ms">{{.Detail}}</span></div>{{end}}
